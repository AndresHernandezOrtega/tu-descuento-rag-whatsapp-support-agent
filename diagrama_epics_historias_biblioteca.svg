<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1000" height="720" viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth"
            markerWidth="8" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
    </marker>
    <style>
      .epic { fill:#2E86AB; stroke:#1B4F72; stroke-width:2; rx:12; }
      .epic-text { fill:#fff; font-weight:700; font-size:16px; }
      .story { fill:#A9D6EB; stroke:#2E86AB; stroke-width:1.5; rx:8; }
      .story-text { fill:#0B3954; font-size:13px; font-weight:600; }
      .role-label { fill:#0B3954; font-size:13px; font-weight:700; opacity:0.9; }
      .caption { fill:#333; font-size:12px; }
      .border { stroke:#ddd; stroke-width:1; fill:none; }
    </style>
  </defs>

  <!-- Title -->
  <text x="50%" y="24" text-anchor="middle" font-size="18" fill="#0B3954" font-weight="700">Diagrama — Épicos y Historias de Usuario (Sistema de Biblioteca)</text>

  <!-- Epics (top row) -->
  <g transform="translate(60,40)">
    <rect class="epic" x="0" y="0" width="280" height="60" rx="12" />
    <text class="epic-text" x="140" y="36" text-anchor="middle">Epic: Gestión de Usuarios</text>
    <text class="role-label" x="140" y="52" text-anchor="middle" font-size="12">(Estudiantes)</text>
  </g>

  <g transform="translate(360,40)">
    <rect class="epic" x="0" y="0" width="280" height="60" rx="12" />
    <text class="epic-text" x="140" y="36" text-anchor="middle">Epic: Gestión de Recursos</text>
    <text class="role-label" x="140" y="52" text-anchor="middle" font-size="12">(Bibliotecarios)</text>
  </g>

  <g transform="translate(660,40)">
    <rect class="epic" x="0" y="0" width="280" height="60" rx="12" />
    <text class="epic-text" x="140" y="36" text-anchor="middle">Epic: Operaciones y Reportes</text>
    <text class="role-label" x="140" y="52" text-anchor="middle" font-size="12">(Administración)</text>
  </g>

  <!-- Stories column 1 (under epic 1) -->
  <g transform="translate(60,140)">
    <!-- HU-01 -->
    <rect class="story" x="20" y="0" width="240" height="50" rx="8" />
    <text class="story-text" x="140" y="22" text-anchor="middle">HU-01 — Registro y acceso</text>
    <text class="story-text" x="140" y="40" text-anchor="middle" font-size="11" font-weight="400">(Registro, login, recuperación)</text>

    <!-- HU-02 -->
    <rect class="story" x="20" y="90" width="240" height="50" rx="8" />
    <text class="story-text" x="140" y="112" text-anchor="middle">HU-02 — Buscar libros</text>
    <text class="story-text" x="140" y="130" text-anchor="middle" font-size="11" font-weight="400">(Título, autor, filtros)</text>

    <!-- HU-04 -->
    <rect class="story" x="20" y="180" width="240" height="50" rx="8" />
    <text class="story-text" x="140" y="202" text-anchor="middle">HU-04 — Mis préstamos y renovaciones</text>
  </g>

  <!-- Stories column 2 (under epic 2) -->
  <g transform="translate(360,140)">
    <rect class="story" x="20" y="0" width="240" height="50" rx="8" />
    <text class="story-text" x="140" y="22" text-anchor="middle">HU-05 — Gestionar catálogo</text>

    <rect class="story" x="20" y="90" width="240" height="50" rx="8" />
    <text class="story-text" x="140" y="112" text-anchor="middle">HU-06 — Registrar préstamo y devolución</text>

    <rect class="story" x="20" y="180" width="240" height="50" rx="8" />
    <text class="story-text" x="140" y="202" text-anchor="middle">HU-03 — Reservar / Solicitar préstamo</text>
  </g>

  <!-- Stories column 3 (under epic 3) -->
  <g transform="translate(660,140)">
    <rect class="story" x="20" y="0" width="240" height="50" rx="8" />
    <text class="story-text" x="140" y="22" text-anchor="middle">HU-07 — Multas e historial</text>

    <rect class="story" x="20" y="90" width="240" height="50" rx="8" />
    <text class="story-text" x="140" y="112" text-anchor="middle">HU-08 — Informes de uso</text>

    <rect class="story" x="20" y="180" width="240" height="50" rx="8" />
    <text class="story-text" x="140" y="202" text-anchor="middle">HU-09 — Dashboard administrativo</text>

    <rect class="story" x="20" y="270" width="240" height="50" rx="8" />
    <text class="story-text" x="140" y="292" text-anchor="middle">HU-10 — Administración de adquisiciones</text>
  </g>

  <!-- Connectors (epic 1 to stories) -->
  <line x1="200" y1="100" x2="140" y2="140" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="200" y1="100" x2="300" y2="190" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="200" y1="100" x2="200" y2="270" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Connectors (epic 2 to stories) -->
  <line x1="500" y1="100" x2="440" y2="140" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="500" y1="100" x2="540" y2="190" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="500" y1="100" x2="520" y2="270" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Connectors (epic 3 to stories) -->
  <line x1="820" y1="100" x2="760" y2="140" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="820" y1="100" x2="820" y2="190" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="820" y1="100" x2="880" y2="260" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="820" y1="100" x2="820" y2="350" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Caption -->
  <text x="50%" y="690" text-anchor="middle" class="caption">Figura 1. Diagrama de épicos y historias de usuario — Sistema de Gestión de Biblioteca (Universidad X)</text>
</svg>
